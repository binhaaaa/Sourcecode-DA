<h3 class="mb-4">
    📄 Quản lý hợp đồng
</h3>

<!-- ================= SEARCH ================= -->

<input
    id="searchInput"
    class="form-control mb-3"
    placeholder="Tìm theo tên khách..."
    onkeyup="searchContract()"
/>

<!-- ================= TABLE ================= -->

<div class="table-wrapper">

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

            <tr>

                <th>ID</th>

                <th>Block</th>
                <th>Tầng</th>
                <th>Phòng</th>
                <th>Giá</th>

                <th>Khách thuê</th>
                <th>CCCD</th>
                <th>SĐT</th>
                <th>Quê quán</th>
                <th>Ngày sinh</th>
                <th>Giới tính</th>

                <th>Ngày bắt đầu</th>
                <th>Ngày kết thúc</th>
                <th>Tiền cọc</th>
                <th>Trạng thái</th>
                <th>Ghi chú</th>

                <th>Hành động</th>

            </tr>

        </thead>

        <tbody id="contractTable"></tbody>

    </table>

</div>

<!-- ================= FORM ================= -->

<hr>

<h4 class="mb-3">
    ➕ Thêm / Sửa hợp đồng
</h4>

<div class="card p-3 shadow-sm">

    <!-- ROW 1 -->

    <div class="row">

        <div class="col-md-6">

            <select
                id="roomId"
                class="form-control mb-3"
            >
            </select>

        </div>

        <div class="col-md-6">

            <select
                id="tenantId"
                class="form-control mb-3"
            >
            </select>

        </div>

    </div>

    <!-- ROW 2 -->

    <div class="row">

        <div class="col-md-6">

            <input
                type="date"
                id="startDate"
                class="form-control mb-3"
            >

        </div>

        <div class="col-md-6">

            <input
                type="date"
                id="endDate"
                class="form-control mb-3"
            >

        </div>

    </div>

    <!-- ROW 3 -->

    <div class="row">

        <div class="col-md-6">

            <input
                type="number"
                id="deposit"
                class="form-control mb-3"
                placeholder="Tiền cọc"
            >
            

        </div>

        <div class="col-md-6">

            <select
                id="status"
                class="form-control mb-3"
            >
            
                <option value="Hiệu lực">
                    Hiệu lực
                </option>

                <option value="Đã thanh lý">
                    Đã thanh lý
                </option>

            </select>

        </div>

    </div>

    <!-- ROW 4 -->

    <div class="row">

        <div class="col-md-12">
            <input
                id="note"
                class="form-control mb-3"
                placeholder="Ghi chú..."   !important
            >

        </div>

    </div>

    <!-- BUTTON -->

    <div class="mt-3">

        <button
            class="btn btn-primary"
            onclick="saveContract()"
        >
            💾 Lưu
        </button>

        <button
            class="btn btn-secondary"
            onclick="resetForm()"
        >
            🔄 Reset
        </button>

    </div>

</div>
