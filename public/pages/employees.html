<h3 class="mb-4">
    👨‍💼 Quản lý nhân viên
</h3>

<!-- ================= SEARCH ================= -->

<input
    id="searchInput"
    class="form-control mb-3"
    placeholder="Tìm theo tên..."
    onkeyup="searchEmployee()"
>

<!-- ================= TABLE ================= -->

<div class="table-wrapper">

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

            <tr>

                <th>ID</th>

                <th>Họ tên</th>

                <th>CCCD</th>

                <th>SĐT</th>

                <th>Chức vụ</th>

                <th>Lương</th>

                <th>Trạng thái</th>

                <th>Hành động</th>

            </tr>

        </thead>

        <tbody id="employeeTable"></tbody>

    </table>

</div>

<!-- ================= FORM ================= -->

<hr>

<h4 class="mb-3">
    ➕ Thêm / Sửa
</h4>

<div class="card p-3 shadow-sm">

    <!-- ROW 1 -->

    <div class="row">

        <div class="col-md-6">

            <input
                id="name"
                class="form-control mb-3"
                placeholder="Họ tên"
            >

        </div>

        <div class="col-md-6">

            <input
                id="cccd"
                class="form-control mb-3"
                placeholder="CCCD"
            >

        </div>

    </div>

    <!-- ROW 2 -->

    <div class="row">

        <div class="col-md-6">

            <input
                id="phone"
                class="form-control mb-3"
                placeholder="SĐT"
            >

        </div>

        <div class="col-md-6">

            <input
                id="salary"
                type="number"
                class="form-control mb-3"
                placeholder="Lương"
            >

        </div>

    </div>

    <!-- ROW 3 -->

    <div class="row">

        <div class="col-md-6">

            <select
                id="role"
                class="form-control mb-3"
            >

                <option value="1">
                    Quản lý
                </option>

                <option value="2">
                    Nhân viên
                </option>

                <option value="3">
                    Bảo vệ
                </option>

                <option value="4">
                    Lao công
                </option>

            </select>

        </div>

        <div class="col-md-6">

            <select
                id="status"
                class="form-control mb-3"
            >

                <option value="Đang làm việc">
                    Đang làm việc
                </option>

                <option value="Nghỉ việc">
                    Nghỉ việc
                </option>

            </select>

        </div>

    </div>

    <!-- BUTTON -->

    <div class="mt-3">

        <button
            class="btn btn-primary"
            onclick="saveEmployee()"
        >
            💾 Lưu
        </button>

        <button
            class="btn btn-secondary"
            onclick="resetForm()"
        >
            🔄 Reset
        </button>

    </div>

</div>
