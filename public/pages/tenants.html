<h3 class="mb-4">
    👤 Quản lý khách thuê
</h3>

<!-- ================= SEARCH ================= -->

<input
    id="searchInput"
    class="form-control mb-3"
    placeholder="Tìm theo tên khách..."
    onkeyup="searchTenant()"
/>

<!-- ================= TABLE ================= -->

<div class="table-wrapper">

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

            <tr>

                <th>ID</th>

                <th>Họ tên</th>

                <th>CCCD</th>

                <th>Quê quán</th>

                <th>SĐT</th>

                <th>Email</th>

                <th>Ngày sinh</th>

                <th>Giới tính</th>

                <th>Đại diện</th>

                <th>Hành động</th>

            </tr>

        </thead>

        <tbody id="tenantTable"></tbody>

    </table>

</div>

<!-- ================= FORM ================= -->

<hr>

<h4 class="mb-3">
    ➕ Thêm / Sửa
</h4>

<div class="card p-3 shadow-sm">

    <input
        id="id"
        type="hidden"
    >

    <!-- ROW 1 -->

    <div class="row">

        <div class="col-md-6">

            <input
                id="name"
                class="form-control mb-3"
                placeholder="Họ tên"
            >

        </div>

        <div class="col-md-6">

            <input
                id="cccd"
                class="form-control mb-3"
                placeholder="CCCD"
            >

        </div>

    </div>

    <!-- ROW 2 -->

    <div class="row">

        <div class="col-md-6">

            <input
                id="hometown"
                class="form-control mb-3"
                placeholder="Quê quán"
            >

        </div>

        <div class="col-md-6">

            <input
                id="phone"
                class="form-control mb-3"
                placeholder="SĐT"
            >

        </div>

    </div>

    <!-- ROW 3 -->

    <div class="row">

        <div class="col-md-6">

            <input
                id="email"
                class="form-control mb-3"
                placeholder="Email"
            >

        </div>

        <div class="col-md-6">

            <input
                type="date"
                id="birth"
                class="form-control mb-3"
            >

        </div>

    </div>

    <!-- ROW 4 -->

    <div class="row">

        <div class="col-md-6">

            <select
                id="gender"
                class="form-control mb-3"
            >

                <option value="Nam">
                    Nam
                </option>

                <option value="Nữ">
                    Nữ
                </option>

            </select>

        </div>

        <div class="col-md-6">

            <select
                id="represent"
                class="form-control mb-3"
            >

                <option value="1">
                    Đại diện
                </option>

                <option value="0">
                    Thành viên
                </option>

            </select>

        </div>

    </div>

    <!-- BUTTON -->

    <div class="mt-3">

        <button
            class="btn btn-primary"
            onclick="saveTenant()"
        >
            💾 Lưu
        </button>

        <button
            class="btn btn-secondary"
            onclick="resetForm()"
        >
            🔄 Reset
        </button>

    </div>

</div>
