<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tenants</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-3">

<h3>👤 Quản lý khách thuê</h3>

<input id="searchInput" class="form-control mb-3" placeholder="Tìm theo tên...">
<div class="table-wrapper">
<table class="table table-bordered table-hover">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Họ tên</th>
            <th>CCCD</th>
            <th>Quê quán</th>
            <th>SĐT</th>
            <th>Email</th>
            <th>Ngày sinh</th>
            <th>Giới tính</th>
            <th>Đại diện</th>
            <th>Hành động</th>
        </tr>
    </thead>
    <tbody id="tenantTable"></tbody>
</table>
</div>

<h4>➕ Thêm / Sửa</h4>

<input id="id" type="hidden">

<div class="row">
    <div class="col-md-6">
        <input id="name" class="form-control mb-2" placeholder="Họ tên">
    </div>
    <div class="col-md-6">
        <input id="cccd" class="form-control mb-2" placeholder="CCCD">
    </div>
</div>

<div class="row">
    <div class="col-md-6">
        <input id="hometown" class="form-control mb-2" placeholder="Quê quán">
    </div>
    <div class="col-md-6">
        <input id="phone" class="form-control mb-2" placeholder="SĐT">
    </div>
</div>

<div class="row">
    <div class="col-md-6">
        <input id="email" class="form-control mb-2" placeholder="Email">
    </div>
    <div class="col-md-6">
        <input type="date" id="birth" class="form-control mb-2">
    </div>
</div>

<div class="row">
    <div class="col-md-6">
        <select id="gender" class="form-control mb-2">
            <option value="Nam">Nam</option>
            <option value="Nữ">Nữ</option>
        </select>
    </div>
    <div class="col-md-6">
        <select id="represent" class="form-control mb-2">
            <option value="1">Đại diện</option>
            <option value="0">Thành viên</option>
        </select>
    </div>
</div>

<button class="btn btn-primary" onclick="saveTenant()">💾 Lưu</button>
<button class="btn btn-secondary" onclick="resetForm()">🔄 Reset</button>

</body>
</html>
