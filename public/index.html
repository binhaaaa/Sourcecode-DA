<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Motel Admin</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { 
            display: flex; 
            margin: 0;
        }

        .sidebar {
            width: 220px;

            background: #2c3e50;
            color: white;
            padding: 20px;

            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;

            overflow-y: auto;
        }

        .sidebar a {
            display: block;
            padding: 10px;
            color: white;
            cursor: pointer;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #34495e;
        }

        .content {
            flex: 1;
            padding: 20px;
            background: lightblue;

            margin-left: 220px;
            min-height: 100vh;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h4>🏠 Motel</h4>

    <a onclick="loadPage('dashboard', this)">Dashboard</a>

    <a onclick="loadPage('rooms', this)">Phòng</a>

    <a onclick="loadPage('tenants', this)">Khách</a>

    <a onclick="loadPage('contracts', this)">Hợp đồng</a>

    <a onclick="loadPage('invoices', this)">Hóa đơn</a>

    <a onclick="loadPage('employees', this)">Nhân viên</a>

    <a onclick="loadPage('roomRentals', this)">Thuê phòng</a>

</div>

<div class="content">
    <h2 id="title"></h2>
    <div id="main"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="js/app.js"></script>

</body>
</html>
